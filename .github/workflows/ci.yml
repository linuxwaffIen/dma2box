name: CI/CD

on:
  push:
    branches: [main, testing]
  pull_request:
    branches: [main, testing]

jobs:
  test:
    name: Тесты и компиляция
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout репозитория
        uses: actions/checkout@v5

      - name: Установка Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Установка системных зависимостей
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev \
            libadwaita-1-dev \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            libgirepository1.0-dev \
            python3-gi \
            python3-gi-cairo \
            libx11-dev \
            libglib2.0-dev \
            libjson-c-dev

      - name: Установка Python зависимостей
        run: |
          pip install --upgrade pip
          pip install nuitka patchelf

      - name: Проверка компиляции исходников
        run: |
          python3 -m compileall -q dma2box tests
        working-directory: arch/x86_64

      - name: Запуск unit-тестов
        run: |
          python3 -m unittest discover -s tests -p "test_*.py"
        working-directory: arch/x86_64

      - name: ShellCheck install.sh
        run: |
          # -S warning: info-уровень (SC1091 на динамический source
          # arch/detect.sh) — ожидаемый шум врапперов, не повод для красного CI.
          shellcheck -S warning \
            install.sh build.sh \
            arch/x86/install.sh arch/x86_64/install.sh \
            arch/arm/aarch32/install.sh arch/arm/aarch64/install.sh \
            arch/arm/armv7/install.sh \
            arch/x86/build.sh arch/x86_64/build.sh \
            arch/arm/aarch32/build.sh arch/arm/aarch64/build.sh \
            arch/arm/armv7/build.sh
